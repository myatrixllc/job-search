name: Daily Job Match Report

on:
  schedule:
    # 6:00 AM CST = 12:00 UTC | 6:00 AM CDT = 11:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-job-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jobspy pandas python-dotenv

      - name: Run job scraper and generate report
        run: python fetch_jobs.py
        continue-on-error: true

      - name: Send email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_report.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: job-report-${{ github.run_id }}
          path: |
            job_report_*.html
            leadership_jobs_*.csv
          retention-days: 30
        if: always()

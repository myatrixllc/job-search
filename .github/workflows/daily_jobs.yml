name: Daily Job Match Report

on:
  schedule:
    # Runs at 6:00 AM UTC every day
    # Adjust for your timezone: 6am CST = 12:00 UTC, 6am CDT = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  run-job-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scraper and generate report
        run: python fetch_jobs.py

      - name: Send email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_report.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-report-${{ github.run_id }}
          path: |
            job_report_*.html
            leadership_jobs_*.csv
          retention-days: 30
